# Dependency update PRs. Both surfaces here rot silently otherwise: a public
# site with no automated path means a CVE fix lands only when someone
# remembers to bump.
#
# Weekly, and nothing merges itself — update PRs arrive like the SSoT sync PRs
# do and deploy only when a maintainer merges them.
version: 2
updates:
  # npm — Docusaurus, React and the theme packages behind the published site.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The five @docusaurus/* packages are released in lockstep and have to
      # move together; ungrouped they arrive as five PRs that each fail the
      # build until the other four land.
      docusaurus:
        patterns:
          - "@docusaurus/*"
    commit-message:
      # The repo writes Conventional Commits by hand; keep bot history in the
      # same shape rather than "Bump x from a to b".
      prefix: chore
      include: scope
    # Same label drt uses, so a filter or board that spans both repos matches
    # both. Without this Dependabot still adds "dependencies" but also tacks on
    # an ecosystem label, which drt's PRs do not carry.
    labels:
      - dependencies

  # GitHub Actions — the workflows pin majors (checkout@v4, setup-node@v4,
  # create-pull-request@v6). Majors go unsupported without warning, and the
  # first symptom is a workflow that stops running.
  #
  # Deliberately ungrouped, unlike the npm block above: these actions are
  # independent of each other, so one PR each stays reviewable and lets a bad
  # bump be reverted on its own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
