name: Sync from drt (SSoT)

# Keeps the site a view of drt-hub/drt: regenerates the connector matrix and
# pulls docs, then opens a PR. Nothing deploys until a maintainer merges it.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [drt-updated] # fired by drt-hub/drt on release / docs merge (optional; needs a PAT secret in drt)

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate connector matrix + docs from drt
        run: bash scripts/sync-from-drt.sh

      # Same reasoning as the build check below: this PR is opened with
      # GITHUB_TOKEN, so check-generated-docs.yml never runs on it — and this is
      # the one job that actually rewrites the CLI reference. Running the
      # generator a second time and diffing proves it is idempotent, which is
      # the assumption the whole drift check rests on. A second run that differs
      # means the renderer is non-deterministic, and the pages about to be
      # committed are arbitrary.
      - name: Verify the CLI reference is reproducible
        run: |
          python scripts/gen-cli-reference.py --output "${RUNNER_TEMP}/cli-recheck"
          if ! diff -ru synced-docs/cli "${RUNNER_TEMP}/cli-recheck"; then
            echo "::error::gen-cli-reference.py is not idempotent — two runs in the same environment disagree."
            exit 1
          fi
          echo "CLI reference is reproducible."

      # Build-check the regenerated site before opening a PR. Bot-created PRs
      # don't trigger the deploy.yml `pull_request` build (GITHUB_TOKEN can't
      # trigger workflows), so validate here: if a synced doc/data change breaks
      # the Docusaurus build, fail the sync instead of opening a broken PR.
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 20
          cache: npm
      - name: Build-check regenerated site
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci
          npm run build

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-from-drt
          delete-branch: true
          title: "chore: sync connector matrix + docs from drt"
          commit-message: "chore: sync connector matrix + docs from drt-hub/drt"
          labels: sync
          body: |
            Automated SSoT sync from `drt-hub/drt`:

            - regenerated `data/destinations.json` / `data/sources.json` (`drt destinations|sources --format json`)
            - refreshed `data/version.txt` (PyPI `drt-core`)
            - pulled `docs/` + `README.md` into `synced-docs/`

            Generated files only — review the diff and **merge to deploy**.
