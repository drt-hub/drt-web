name: Check generated docs

# Regenerates the committed CLI reference and fails if anything moves. The pins
# added in #44 stop silent drift; this detects it. Two cases are currently
# invisible: someone hand-edits a generated page, or a renderer bump changes the
# output — both land as ordinary-looking Markdown in a diff nobody reads closely.
#
# Scope: synced-docs/cli and data/*.json — everything the pinned drt-core
# install this job already makes can re-derive on its own. Two things stay
# uncovered. data/version.txt *is* the pin, so regenerating it from the install
# it selected would confirm nothing; only the sync run can move it. And the rest
# of synced-docs/ is copied verbatim from drt by scripts/sync-from-drt.sh and
# cannot be re-derived without a live clone, so a hand-edit there is still
# invisible to CI — see #52 for the shapes considered. Worth revisiting when the
# rest of synced-docs/ is wired into Docusaurus.
#
# Runs on pull_request *and* on push to main. Sync PRs are opened with
# GITHUB_TOKEN, which cannot trigger workflows, so the one branch that actually
# rewrites these pages would otherwise never be checked — and the drift would
# first surface on an unrelated contributor's PR, blaming them for it. The push
# trigger reports it against the commit that introduced it instead.
# scripts/sync-from-drt.yml also re-runs the generator inline to catch a
# non-idempotent sync before the PR is even opened.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs are pure waste: each one reinstalls the whole drt-core tree.
concurrency:
  group: check-generated-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The output path is also hardcoded in scripts/sync-from-drt.sh and
      # registered in docusaurus.config.js — keep all three in step. Declared
      # once here so the two steps below cannot drift apart from each other.
      CLI_DOCS_DIR: synced-docs/cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-cli-docs.txt

      # drt-core is pinned to the version recorded alongside the pages, not to
      # the latest release. The committed reference and data/version.txt are
      # written by the same sync run, so this asks the precise question: do the
      # committed pages match what *this* release plus *these* renderers
      # produce? Left floating, every open PR would start failing the moment drt
      # published a release — a false alarm that belongs to the sync workflow,
      # and the fastest way to get a check like this switched off.
      #
      # The renderer versions come from the same file scripts/sync-from-drt.sh
      # installs, and are exact `==` pins, so the check cannot resolve a
      # different Typer than the one that generated the pages.
      - name: Install the pinned generator toolchain
        run: |
          if [ ! -f data/version.txt ]; then
            echo "::error file=data/version.txt::data/version.txt is missing — cannot pin drt-core for the drift check."
            exit 1
          fi
          version="$(tr -d '[:space:]' < data/version.txt)"
          if [ -z "$version" ]; then
            echo "::error file=data/version.txt::data/version.txt is empty — cannot pin drt-core for the drift check."
            exit 1
          fi
          echo "Pinning drt-core==${version} (from data/version.txt)"
          python -m pip install --quiet --upgrade \
            "drt-core[docs]==${version}" \
            -r scripts/requirements-cli-docs.txt

      # Recorded explicitly: --quiet swallows pip's resolution summary, and
      # "which renderer produced these pages" is the first question asked when
      # this check fails unexpectedly.
      - name: Record the resolved toolchain
        run: python -m pip freeze | grep -E '^(drt-core|click|typer)=='

      # data/destinations.json and data/sources.json come off the same installed
      # CLI as the pages below — `drt destinations|sources --format json`, the
      # exact commands scripts/sync-from-drt.sh writes them with — so the pinned
      # install above answers the same question for them at no extra cost: does
      # this release still produce the committed file? These two are what the
      # site's connector matrix renders from, so an edit here changes what the
      # site claims drt supports with nothing upstream behind it.
      #
      # Compared byte for byte, deliberately without canonicalising either side.
      # Both commands are a plain print(json.dumps(..., indent=2)) over a static
      # table in drt.config.connectors: no network, no config file, and no cwd or
      # terminal width reaching the output, with print() supplying the trailing
      # newline the committed files carry. Re-serialising before comparing would
      # buy nothing and would hide a real change in what drt emits — a key order
      # or indent change is drift, not noise.
      #
      # Written to RUNNER_TEMP rather than over data/: nothing here needs to
      # dirty the worktree, and comparing named files lets the failure point at
      # the stale one rather than leaving a combined `git diff` to imply it.
      #
      # Ordered before the CLI reference on purpose. Either check failing hides
      # the other, and this is the cheap one — two subprocess calls against an
      # already-installed CLI, no filesystem rewrite — so it should not sit
      # behind a full regeneration of the reference to be discovered.
      - name: Fail if the committed connector matrix is stale
        run: |
          version="$(tr -d '[:space:]' < data/version.txt)"
          out="${RUNNER_TEMP}/connector-matrix"
          mkdir -p "$out"

          stale=0
          # The subcommand and the file's basename are the same word by
          # construction: `drt destinations` writes data/destinations.json.
          for name in destinations sources; do
            committed="data/${name}.json"
            regenerated="${out}/${name}.json"

            # The document goes to stdout and nothing to stderr, so a non-zero
            # exit is a broken CLI rather than drift, and reporting it as drift
            # would send a contributor to regenerate a file that is already
            # correct.
            if ! drt "$name" --format json > "$regenerated"; then
              echo "::error::\`drt ${name} --format json\` failed under drt-core ${version} — this is a tooling failure, not drift."
              exit 1
            fi

            if [ ! -f "$committed" ]; then
              echo "::error file=${committed}::${committed} is missing — it is generated by \`drt ${name} --format json\` and must be committed."
              stale=1
              continue
            fi

            # Same distinction the CLI diff below makes: 1 is "the files
            # differ", anything above it is diff itself failing.
            set +e
            diff -u "$committed" "$regenerated"
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              continue
            fi
            if [ "$rc" -ne 1 ]; then
              echo "::error::diff failed with status ${rc} on ${committed} — this is a tooling failure, not documentation drift."
              exit "$rc"
            fi

            # Both files are checked before failing, so a sync that moved the
            # two does not take two round trips to report.
            echo "::error file=${committed}::${committed} is out of date — it does not match \`drt ${name} --format json\` from drt-core ${version}."
            stale=1
          done

          if [ "$stale" -eq 0 ]; then
            echo "Connector matrix is up to date with drt-core ${version}."
            exit 0
          fi

          cat <<'EOF'

          The files above are generated and must not be edited by hand. In each
          diff, `-` is what is committed and `+` is what drt actually emits.
          A difference means one of:

            * data/destinations.json or data/sources.json was edited directly —
              revert it and change drt's connector registry instead;
            * data/version.txt was changed without regenerating the matrix;
            * drt gained or dropped a connector and only part of a sync landed.

          To fix, from the repo root. Use a throwaway virtualenv: the pinned
          install would otherwise replace whatever drt-core is in your current
          environment, including an editable checkout.

            python3.12 -m venv /tmp/drt-matrix && . /tmp/drt-matrix/bin/activate
            python -m pip install --upgrade \
              "drt-core[docs]==$(tr -d '[:space:]' < data/version.txt)"
            drt destinations --format json > data/destinations.json
            drt sources      --format json > data/sources.json

          Then commit the regenerated files with the change that caused them.
          EOF
          exit 1

      # The generator, unchanged and reused as-is — no rendering logic is
      # duplicated here. Only the CLI reference is regenerated:
      # scripts/sync-from-drt.sh also re-clones drt into synced-docs/, which
      # would diff against upstream's latest docs and fail on every PR.
      - name: Regenerate the CLI reference
        run: python scripts/gen-cli-reference.py --output "$CLI_DOCS_DIR"

      # Two things this diff has to get right, both verified against git 2.47:
      #
      # `git add -N` records new pages as intent-to-add, so a brand-new drt
      # command is seen at all — without it `git diff` ignores the untracked
      # file and the drift is missed.
      #
      # The diff is taken against HEAD, not the index. `git add -N` *stages*
      # deletions, so a worktree-vs-index diff reports nothing when a command is
      # removed upstream and its page disappears — the check would print "up to
      # date" while a stale page stayed committed. Against HEAD, additions,
      # modifications and deletions are all caught.
      - name: Fail if the committed pages are stale
        run: |
          git add --intent-to-add -- "$CLI_DOCS_DIR"

          # Distinguish "differences found" (1) from "git itself failed" (128),
          # which would otherwise be reported as a hand-edited page.
          set +e
          git diff --exit-code HEAD -- "$CLI_DOCS_DIR"
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "CLI reference is up to date with drt-core $(tr -d '[:space:]' < data/version.txt)."
            exit 0
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::git diff failed with status ${rc} — this is a tooling failure, not documentation drift."
            exit "$rc"
          fi

          echo
          echo "::error::Generated CLI reference is stale — ${CLI_DOCS_DIR} does not match what scripts/gen-cli-reference.py produces."
          cat <<'EOF'

          The pages above are generated and must not be edited by hand.
          A diff here means one of:

            * a generated page was edited directly — revert it and change drt instead;
            * scripts/gen-cli-reference.py changed how pages are rendered;
            * a pin in scripts/requirements-cli-docs.txt was bumped, so the
              renderer now emits different Markdown;
            * data/version.txt was changed without regenerating the reference;
            * the pins resolved to a different renderer than the sync run used —
              compare the "Record the resolved toolchain" step above against the
              sync run that last wrote these pages.

          To fix, from the repo root. Use a throwaway virtualenv: the pinned
          install would otherwise replace whatever drt-core is in your current
          environment, including an editable checkout.

            python3.12 -m venv /tmp/drt-docs && . /tmp/drt-docs/bin/activate
            python -m pip install --upgrade \
              "drt-core[docs]==$(tr -d '[:space:]' < data/version.txt)" \
              -r scripts/requirements-cli-docs.txt
            python scripts/gen-cli-reference.py --output synced-docs/cli
            git add synced-docs/cli

          The generator deletes its output directory before rewriting it, so if
          it fails partway you are left with an incomplete synced-docs/cli.
          `git checkout -- synced-docs/cli` restores it.

          Then commit the regenerated pages with the change that caused them.
          EOF
          exit 1
